name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # กดสร้างเองได้จากหน้า Actions
  pull_request:
    paths: ["src/**", "packaging/**", ".github/workflows/**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: python -m pip install --upgrade pip openpyxl pyinstaller

      - name: ตั้งค่าการแจ้งเตือนเวอร์ชันใหม่
        run: python packaging/set_repo.py ${{ github.repository }}

      - name: สร้างไฟล์ .exe
        run: >
          python -m PyInstaller --onefile --noconfirm --clean
          --name OralHealthDashboard
          --add-data "src/dashboard_template.html;."
          --add-data "src/hospitals.csv;."
          --hidden-import openpyxl
          src/build_dashboard.py

      - name: ทดสอบด้วยข้อมูลจำลอง
        run: |
          python tools/make_sample_data.py smoke/data
          Copy-Item dist/OralHealthDashboard.exe smoke/
          cd smoke
          ./OralHealthDashboard.exe --no-open
          if (-not (Test-Path "ผลลัพธ์/dashboard.html")) { throw "ไม่พบไฟล์ผลลัพธ์" }
          $size = (Get-Item "ผลลัพธ์/dashboard.html").Length
          Write-Host "dashboard.html ขนาด $size ไบต์"
          if ($size -lt 20000) { throw "ไฟล์ผลลัพธ์เล็กผิดปกติ" }
        shell: pwsh

      - name: ประกอบไฟล์ zip
        run: python packaging/make_package.py ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OralHealthDashboard
          path: OralHealthDashboard-*.zip

      - name: แนบไฟล์ลง Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: OralHealthDashboard-*.zip
          generate_release_notes: true
