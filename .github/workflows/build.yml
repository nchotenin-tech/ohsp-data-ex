name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # กดสร้างเองได้จากหน้า Actions
  pull_request:
    paths: ["src/**", "tools/**", "packaging/**", ".github/workflows/**"]

jobs:
  # ---------- เว็บแอปไฟล์เดียว (ตัวหลักตั้งแต่ v2.0.0) ----------
  webapp:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ติดตั้งไลบรารี
        run: python -m pip install --upgrade pip openpyxl
      - name: สร้าง OHSP-Dashboard.html
        run: python tools/build_webapp.py
      - name: ทดสอบว่าผลคำนวณตรงกับเวอร์ชัน Python ทุกค่า
        run: |
          python tools/make_sample_data.py data
          python src/build_dashboard.py --no-open --no-update-check
          node tools/parity_test.mjs data "ผลลัพธ์/summary.json" dist/hospitals.packed.json
      - name: ตั้งชื่อไฟล์ตามเวอร์ชัน
        run: |
          mkdir -p webapp
          cp dist/OHSP-Dashboard.html "webapp/OHSP-Dashboard-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}.html"
      - name: สร้าง zip พร้อมโครงสร้างโฟลเดอร์มาตรฐาน
        run: python tools/make_webapp_package.py webapp
      - uses: actions/upload-artifact@v4
        with:
          name: OHSP-Dashboard-html
          path: webapp/

  # ---------- โปรแกรม .exe (ทางเลือกสำรอง) ----------
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # กันข้อความภาษาไทยทำให้สคริปต์ Python พังบน Windows
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: python -m pip install --upgrade pip openpyxl pyinstaller

      - name: ตั้งค่าการแจ้งเตือนเวอร์ชันใหม่
        run: python packaging/set_repo.py ${{ github.repository }}

      - name: สร้างไฟล์ .exe
        run: >
          python -m PyInstaller --onefile --noconfirm --clean
          --name OralHealthDashboard
          --add-data "src/dashboard_template.html;."
          --add-data "src/hospitals.csv;."
          --hidden-import openpyxl
          src/build_dashboard.py

      - name: ทดสอบด้วยข้อมูลจำลอง
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Write-Host "--- generate sample data ---"
          python tools/make_sample_data.py smoke/data
          if ($LASTEXITCODE -ne 0) { throw "make_sample_data.py failed ($LASTEXITCODE)" }

          Copy-Item dist/OralHealthDashboard.exe smoke/
          Push-Location smoke
          Write-Host "--- run the program ---"
          & ./OralHealthDashboard.exe --no-open --no-update-check
          $rc = $LASTEXITCODE
          Write-Host "--- program exit code: $rc ---"

          Write-Host "--- files produced ---"
          Get-ChildItem -Recurse -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
          $log = Get-ChildItem -Recurse -Filter 'log.txt' | Select-Object -First 1
          if ($log) { Write-Host "--- log.txt ---"; Get-Content $log.FullName }

          if ($rc -ne 0) { throw "program exited with code $rc" }
          $html = Get-ChildItem -Recurse -Filter 'dashboard.html' | Select-Object -First 1
          if (-not $html) { throw "dashboard.html was not created" }
          if ($html.Length -lt 20000) { throw "dashboard.html is too small ($($html.Length) bytes)" }
          Write-Host "OK - dashboard.html is $($html.Length) bytes"
          Pop-Location

      - name: ประกอบไฟล์ zip
        run: python packaging/make_package.py ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OralHealthDashboard        # GitHub ห่อเป็น zip ให้เอง ไม่ต้องใส่ zip ซ้อนอีกชั้น
          path: package/

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: OralHealthDashboard-*.zip

  # ---------- เผยแพร่ Release (เมื่อ push tag) ----------
  release:
    if: github.ref_type == 'tag'
    needs: [webapp, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # จำเป็นสำหรับการสร้าง Release และแนบไฟล์
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OHSP-Dashboard-html
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: assets
      - name: แนบไฟล์ลง Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          name: Dashboard วิเคราะห์สภาวะช่องปาก ${{ github.ref_name }}
          body_path: packaging/release_notes.md   # คู่มือย่อ แสดงบนหน้า Release
          append_body: true                       # ต่อท้ายด้วยรายการที่เปลี่ยนแปลงอัตโนมัติ
          generate_release_notes: true
