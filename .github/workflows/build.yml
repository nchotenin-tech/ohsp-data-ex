name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # กดสร้างเองได้จากหน้า Actions
  pull_request:
    paths: ["src/**", "packaging/**", ".github/workflows/**"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # จำเป็นสำหรับการสร้าง Release และแนบไฟล์
    env:
      PYTHONIOENCODING: utf-8  # กันข้อความภาษาไทยทำให้สคริปต์ Python พังบน Windows
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: python -m pip install --upgrade pip openpyxl pyinstaller

      - name: ตั้งค่าการแจ้งเตือนเวอร์ชันใหม่
        run: python packaging/set_repo.py ${{ github.repository }}

      - name: สร้างไฟล์ .exe
        run: >
          python -m PyInstaller --onefile --noconfirm --clean
          --name OralHealthDashboard
          --add-data "src/dashboard_template.html;."
          --add-data "src/hospitals.csv;."
          --hidden-import openpyxl
          src/build_dashboard.py

      - name: ทดสอบด้วยข้อมูลจำลอง
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Write-Host "--- generate sample data ---"
          python tools/make_sample_data.py smoke/data
          if ($LASTEXITCODE -ne 0) { throw "make_sample_data.py failed ($LASTEXITCODE)" }

          Copy-Item dist/OralHealthDashboard.exe smoke/
          Push-Location smoke
          Write-Host "--- run the program ---"
          & ./OralHealthDashboard.exe --no-open --no-update-check
          $rc = $LASTEXITCODE
          Write-Host "--- program exit code: $rc ---"

          Write-Host "--- files produced ---"
          Get-ChildItem -Recurse -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
          $log = Get-ChildItem -Recurse -Filter 'log.txt' | Select-Object -First 1
          if ($log) { Write-Host "--- log.txt ---"; Get-Content $log.FullName }

          if ($rc -ne 0) { throw "program exited with code $rc" }
          $html = Get-ChildItem -Recurse -Filter 'dashboard.html' | Select-Object -First 1
          if (-not $html) { throw "dashboard.html was not created" }
          if ($html.Length -lt 20000) { throw "dashboard.html is too small ($($html.Length) bytes)" }
          Write-Host "OK - dashboard.html is $($html.Length) bytes"
          Pop-Location

      - name: ประกอบไฟล์ zip
        run: python packaging/make_package.py ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OralHealthDashboard        # GitHub ห่อเป็น zip ให้เอง ไม่ต้องใส่ zip ซ้อนอีกชั้น
          path: package/

      - name: แนบไฟล์ลง Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: OralHealthDashboard-*.zip
          generate_release_notes: true
